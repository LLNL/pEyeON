name: Container Build Test
on: 
  pull_request:
    branches:
      - main  
  push:
    paths:
      - .dockerignore
      - builds/Dockerfile
      - builds/podman.Dockerfile
      - builds/provision/**
      - .github/workflows/test-build-container.yaml

jobs:
  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            # Avoid qemu user-mode instability during Rust builds by using native arm64.
            runs_on: ubuntu-24.04-arm64

    runs-on: ${{ matrix.runs_on }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
            docker build -f builds/Dockerfile -t peyeon:${{ matrix.arch }} .
     
      - name: Run Test Command
        run: |
            docker run --rm peyeon:${{ matrix.arch }} sh -c "eyeon --help && binwalk --version && command -v sasquatch && command -v 7z"

  podman-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Podman Image
        run: |
            podman build -f builds/podman.Dockerfile -t peyeon:podman .
    
      - name: Run Test Command
        run: |
            podman run --rm peyeon:podman sh -c "eyeon --help && binwalk --version && command -v sasquatch && command -v 7z"
